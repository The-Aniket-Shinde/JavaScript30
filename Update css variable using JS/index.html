<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update CSS variables using JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Update CSS variables using JS</h1>
    </header>
    <main>
        <div id="container">

            <div class="box" id="scale">
                <p>box size</p>
                <input type="range" value="0">
                <div id="size-box"></div>
            </div>

            <div class="box" id="color">
                <p>box color</p>
                <input type="range" value="0">
                <div id="color-box"></div>
            </div>

            <div class="box" id="font">
                <p>Font size</p>
                <input type="range" value="0">
                <div id="font-box">HELLO!!!</div>
            </div>

            <div class="box" id="animation">
                <p>animation speed</p>
                <input type="range" value="0">
                <div id="animation-box"></div>
            </div>

        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
