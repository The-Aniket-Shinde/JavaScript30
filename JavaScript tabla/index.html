<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript तबला</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <header>    
        <h1>तबला made with <span style="color: yellow;">JavaScript</span></h1>
    </header>
    <main>
        <div id="container">
            <div class="key" id="65">
                <kbd>A</kbd>
                <span class="sound">धा(Dha)</span>
            </div>
            <div class="key" id="83">
                <kbd>S</kbd>
                <span class="sound">धिं(Dhin)</span>
            </div>
            <div class="key" id="68">
                <kbd>D</kbd>
                <span class="sound">ना(Na)</span>
            </div>
            <div class="key" id="70">
                <kbd>F</kbd>
                <span class="sound">तीं(Tin)</span>
            </div>
            <div class="key" id="71">
                <kbd>G</kbd>
                <span class="sound">ता(Ta)</span>
            </div>
            <div class="key" id="72">
                <kbd>H</kbd>
                <span class="sound">घे(Ge)</span>
            </div>
            <div class="key" id="74">
                <kbd>J</kbd>
                <span class="sound">के(Ke)</span>
            </div>
            <div class="key" id="75">
                <kbd>K</kbd>
                <span class="sound">तुं(Tun)</span>
            </div>
        </div>
    </main>

    <footer>
        <hr>
        <p>Made with ❤️ by Aniket</p>
    </footer>

    <audio id="65" src="tabla sounds/dha.mp3"></audio>
    <audio id="83" src="tabla sounds/dhin.mp3"></audio>
    <audio id="68" src="tabla sounds/na.mp3"></audio>
    <audio id="70" src="tabla sounds/tin.mp3"></audio>
    <audio id="71" src="tabla sounds/ta.mp3"></audio>
    <audio id="72" src="tabla sounds/ge.mp3"></audio>
    <audio id="74" src="tabla sounds/ke.mp3"></audio>
    <audio id="75" src="tabla sounds/tun.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
